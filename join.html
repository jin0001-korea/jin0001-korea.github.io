<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11262c">
  <title>SLOPE · 강사 계정 설정</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23167d8b'/%3E%3Cpath d='M7 29 20 9l13 20M14 20l6 3 5-6' fill='none' stroke='%23d2eea4' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#11262c;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#14343b}
    .join-card{width:min(440px,100%);background:#fff;border-radius:18px;padding:30px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 18px 48px rgba(0,0,0,.35)}
    .join-brand{display:inline-block;font-weight:800;letter-spacing:.14em;color:#167d8b;font-size:13px}
    h1{font-size:22px;margin-top:4px}
    .join-help{font-size:15px;line-height:1.6;color:#45606a}
    .join-error{font-size:14px;color:#b4232c;background:#fdeef0;border-radius:10px;padding:10px 12px}
    .join-done{font-size:18px;font-weight:700;color:#167d8b}
    form{display:flex;flex-direction:column;gap:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field-label{font-size:13px;font-weight:600;color:#45606a}
    input{font-size:16px;padding:12px 14px;border:1px solid #c4d4d8;border-radius:10px;width:100%}
    input:focus{outline:2px solid #167d8b;border-color:#167d8b}
    .btn{display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;padding:13px 16px;border-radius:10px;border:0;cursor:pointer;text-decoration:none}
    .btn.primary{background:#167d8b;color:#fff}
    .btn.primary:disabled{opacity:.6;cursor:default}
  </style>
  <script type="module" src="./join.mjs?v=2"></script>
</head>
<body>
  <div id="join"><section class="join-card"><header><span class="join-brand">SLOPE</span><h1>강사 계정 설정</h1></header><p class="join-help">페이지를 불러오고 있습니다…</p></section></div>
  <noscript>이 페이지를 사용하려면 자바스크립트를 활성화해 주세요.</noscript>
</body>
</html>
