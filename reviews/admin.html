<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>강사 후기 등록</title>
<style>
:root{--line:#e2e5ea;--ink:#20242b;--sub:#6b7280;--accent:#2563eb;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:20px;margin:6px 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.brand-toggle{display:flex;gap:8px}
.brand-toggle button{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;cursor:pointer}
.brand-toggle button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.stars{display:flex;gap:4px;font-size:26px;cursor:pointer;user-select:none}
.stars span{color:#d1d5db}.stars span.on{color:#f59e0b}
button.primary{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.5}
.msg{margin-top:10px;font-size:13px}.msg.ok{color:#059669}.msg.err{color:#dc2626}
.list-item{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.list-item b{font-size:14px}
.list-item .meta{color:var(--sub);margin:2px 0 4px}
.list-item button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;color:#dc2626;font-size:12px}
.photos-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos-preview img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#loginCard input{margin-bottom:8px}
small.hint{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>강사 후기 등록 <small class="hint">· 카카오 후기 복붙 → 사이트 위젯 자동 반영</small></h1>

  <div class="card" id="loginCard">
    <label>운영 계정 이메일</label><input id="email" type="email" autocomplete="username">
    <label>비밀번호</label><input id="password" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn">로그인</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="card" id="formCard" hidden>
    <label>브랜드</label>
    <div class="brand-toggle" id="brandToggle">
      <button type="button" data-brand="catchski" class="on">캐치스키스쿨</button>
      <button type="button" data-brand="risenski">라이즌스키스쿨</button>
    </div>
    <div class="row">
      <div><label>강사 이름</label><input id="instructor" list="instructorList" placeholder="예: 김OO"><datalist id="instructorList"></datalist></div>
      <div><label>후기 받은 날짜</label><input id="reviewDate" type="date"></div>
    </div>
    <label>별점</label>
    <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <label>후기 내용 (카카오에서 복사해 붙여넣기)</label>
    <textarea id="body" placeholder="고객이 보낸 후기 내용을 그대로 붙여넣어 주세요."></textarea>
    <label>사진 (선택, 최대 6장 · 장당 4MB)</label>
    <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="photos-preview" id="photosPreview"></div>
    <button class="primary" id="submitBtn">후기 등록</button>
    <div class="msg" id="formMsg"></div>
  </div>

  <div class="card" id="listCard" hidden>
    <b id="listTitle">등록된 후기</b>
    <div id="list"></div>
  </div>
</div>
<script>
(() => {
'use strict';
const SUPABASE_URL = 'https://ewiekbmjvgktwsbbxrzw.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3aWVrYm1qdmdrdHdzYmJ4cnp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNTcwMDgsImV4cCI6MjEwODgzMzAwOH0.hdkkOIlejIT6yU37suEojBgQDcdEoUT33EiCAur3fbU';
const FN = SUPABASE_URL + '/functions/v1/slope-reviews';
const $ = id => document.getElementById(id);
let session = null;
try { session = JSON.parse(localStorage.getItem('gjReviewSession') || 'null'); } catch {}
let brand = 'catchski', rating = 5;

const saveSession = value => { session = value; localStorage.setItem('gjReviewSession', JSON.stringify(value)); };
async function authFetch(url, options = {}) {
  const run = () => fetch(url, { ...options, headers: { ...(options.headers || {}), Authorization: 'Bearer ' + session.access_token } });
  let response = await run();
  if (response.status === 401 && session?.refresh_token) {
    const refreshed = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
    if (refreshed.ok) { saveSession(await refreshed.json()); response = await run(); }
    else { localStorage.removeItem('gjReviewSession'); location.reload(); }
  }
  return response;
}

$('loginBtn').addEventListener('click', async () => {
  $('loginMsg').textContent = '';
  const response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }) });
  const data = await response.json();
  if (!response.ok || !data.access_token) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = '로그인에 실패했습니다. 이메일·비밀번호를 확인해 주세요.'; return; }
  saveSession(data); enter();
});

function enter() {
  $('loginCard').hidden = true; $('formCard').hidden = false; $('listCard').hidden = false;
  $('reviewDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  paintStars(); loadList();
}

$('brandToggle').addEventListener('click', event => {
  const button = event.target.closest('button[data-brand]'); if (!button) return;
  brand = button.dataset.brand;
  for (const item of $('brandToggle').children) item.classList.toggle('on', item === button);
  loadList();
});
const paintStars = () => { [...$('stars').children].forEach((star, index) => star.classList.toggle('on', index < rating)); };
$('stars').addEventListener('click', event => {
  const index = [...$('stars').children].indexOf(event.target); if (index < 0) return;
  rating = index + 1; paintStars();
});

$('photos').addEventListener('change', () => {
  const preview = $('photosPreview'); preview.textContent = '';
  for (const file of [...$('photos').files].slice(0, 6)) {
    const img = document.createElement('img'); img.src = URL.createObjectURL(file); preview.appendChild(img);
  }
});

const toBase64 = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

$('submitBtn').addEventListener('click', async () => {
  const message = $('formMsg'); message.textContent = ''; message.className = 'msg';
  const instructorName = $('instructor').value.trim(), body = $('body').value.trim(), reviewDate = $('reviewDate').value;
  if (!instructorName) { message.className = 'msg err'; message.textContent = '강사 이름을 입력해 주세요.'; return; }
  if (!body) { message.className = 'msg err'; message.textContent = '후기 내용을 입력해 주세요.'; return; }
  const files = [...$('photos').files].slice(0, 6);
  if (files.some(file => file.size > 4 * 1024 * 1024)) { message.className = 'msg err'; message.textContent = '사진은 장당 4MB 이하여야 합니다.'; return; }
  $('submitBtn').disabled = true;
  try {
    const photos = [];
    for (const file of files) photos.push({ type: file.type, dataBase64: await toBase64(file) });
    const response = await authFetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ brand, instructorName, rating, body, reviewDate, photos }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || data.error || '등록 실패');
    message.className = 'msg ok'; message.textContent = '등록했습니다. 사이트 위젯에 바로 반영됩니다(최대 5분 캐시).';
    $('body').value = ''; $('photos').value = ''; $('photosPreview').textContent = '';
    loadList();
  } catch (error) {
    message.className = 'msg err'; message.textContent = '등록 실패: ' + (error && error.message || error);
  } finally { $('submitBtn').disabled = false; }
});

async function loadList() {
  const response = await fetch(FN + '?brand=' + brand, { cache: 'no-store' });
  if (!response.ok) return;
  const data = await response.json();
  $('listTitle').textContent = `등록된 후기 · ${data.brandName} ${data.summary.count}건` + (data.summary.average ? ` · 평균 ★${data.summary.average}` : '');
  const datalist = $('instructorList'); datalist.textContent = '';
  for (const item of data.summary.instructors) { const option = document.createElement('option'); option.value = item.name; datalist.appendChild(option); }
  const list = $('list'); list.textContent = '';
  for (const review of data.reviews.slice(0, 30)) {
    const item = document.createElement('div'); item.className = 'list-item';
    const head = document.createElement('b'); head.textContent = `${review.instructorName} · ${'★'.repeat(review.rating)}`;
    const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = review.reviewDate + (review.photos.length ? ` · 사진 ${review.photos.length}장` : '');
    const text = document.createElement('div'); text.textContent = review.body.length > 120 ? review.body.slice(0, 120) + '…' : review.body;
    const remove = document.createElement('button'); remove.textContent = '삭제';
    remove.addEventListener('click', async () => {
      if (!confirm('이 후기를 삭제할까요? 되돌릴 수 없습니다.')) return;
      const removed = await authFetch(FN + '?id=' + encodeURIComponent(review.id), { method: 'DELETE' });
      if (removed.ok) loadList();
    });
    item.append(head, meta, text, remove); list.appendChild(item);
  }
}

if (session?.access_token) enter();
})();
</script>
</body>
</html>
